# nginx reverse-proxy config for Kids English Learning Game
# Place in /etc/nginx/conf.d/kid-english.conf on the Linux server.
#
# Assumes:
#   - Node app runs on 127.0.0.1:3000 (npm install && node server.js)
#   - Run the app with TRUST_PROXY=1 so rate-limiting keys on real client IPs:
#       TRUST_PROXY=1 node server.js
#   - Domain: change server_name to your real domain

server {
    listen 80;
    listen [::]:80;
    server_name kid-english.example.com;

    # Increase proxy timeouts for TTS/slow connections
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Optionally enable gzip for faster page loads
    gzip on;
    gzip_types text/css application/javascript application/json;
}
